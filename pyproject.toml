[project]
name = "munpatch"
version = "0.1.0"
description = "Extrapolate Norwegian municipal statistics across administrative boundary changes"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "pyjstat>=2.4",
    "openpyxl>=3.1",
]

[project.scripts]
munpatch = "munpatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munpatch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
